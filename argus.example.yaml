# Copy this to argus.yaml and replace the placeholder values.
# argus.yaml is gitignored because it contains camera credentials.

# Reolink fleets are commonly hybrid: some cameras answer directly on their own IP
# (standalone), others are reached only through an NVR on a channel. Argus generates
# go2rtc sources per camera. Verified rule of thumb (see LEARNINGS.md):
#   - RTSP paths should be CODEC-PREFIXED (h264Preview_0N_* / h265Preview_0N_main).
#     The bare Preview_0N form 404s on newer 4K/H.265 models (e.g. RLC-812A).
#   - H.264 sub streams work over bare HTTP-FLV; H.265 4K main streams need RTSP.
#   - FLV channel is 0-based (channelN); RTSP Preview is 1-based (Preview_0{N+1}).
cameras:
  # House aspect values from the 2026-10-16 read-only ffprobe (docs/camera-health.md
  # and docs/aspect-migration.md). Copy these into argus.yaml before the next deploy.
  #   Garage Door: "4:3"       main 2560x1920, sub 640x480, AAC-LC 16k
  #   Backyard: "4:3"          RLC-520A. main 2560x1920, sub 640x480, AAC-LC 16k
  #   Backyard Right: "4:3"    D500, NVR h264Preview_07 ch6. main 2560x1920
  #                            h264 25fps, sub 640x480, AAC-LC 16k
  #   Doorbell: "4:3"          Reolink Video Doorbell PoE. measured main
  #                            2560x1920 h264 High 20fps, sub 640x480, AAC-LC 16k
  #   Backyard Left: "16:9"    main 3840x2160 HEVC, sub 640x360, AAC-LC 16k
  #   Front L: "16:9"          Preview_03. main 4512x2512 HEVC 25fps, sub 896x512
  #   Front R: "16:9"          Preview_04. main 4512x2512 HEVC 25fps, sub 896x512
  # Standalone camera — host is the camera's own IP, channel 0.
  # A 4K model: set mainCodec: h265 so the main stream is served over RTSP.
  - name: "Backyard Left"
    aspect: "16:9"          # measured 3840x2160 main, 640x360 sub. "16:9" pads. "4:3" crops.
    host: 192.168.1.105
    channel: 0
    mainCodec: h265         # 4K H.265 main -> RTSP-only; omit/set h264 for 1080p models
    username: admin
    password: change-me
    transport: auto         # auto = FLV-sub primary; main = FLV(H.264) or RTSP(H.265)
    streams:
      main: main            # high-quality stream for recording
      sub: sub              # lower-quality stream for snapshots/prebuffer

  # NVR-fronted camera — host is the NVR; channel selects the camera on the NVR.
  - name: "Front L"
    aspect: "16:9"          # measured 4512x2512 main, 896x512 sub. "16:9" pads. "4:3" crops.
    host: 192.168.1.113     # the NVR's IP
    channel: 2              # NVR channel (RTSP path becomes h264Preview_03_*)
    mainCodec: h265         # 2026-10-16 ffprobe: Front L main is 4512x2512 HEVC
                            # at 25 fps (Preview_03). progress/attempt-003.md:
                            # h264 sent the FLV main first and the recording
                            # source hung. The path name stays h264Preview_*;
                            # FLV main is skipped.
    username: admin
    password: change-me
    transport: auto
    streams:
      main: main
      sub: sub

recording:
  path: ./recordings
  retention:
    continuous: 3
    motion: 7
    alerts: 30

homekit:
  pin: "123-45-678"        # Change before real pairing

go2rtc:
  binary: ./go2rtc
  api_port: 1984

server:
  port: 8080
